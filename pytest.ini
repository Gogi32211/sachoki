[pytest]
testpaths = tests
addopts = -q
markers =
    external_data: needs the canonical research dataset (DuckDB corpus on the QUANT_RESEARCH
        volume). Skipped — with a concrete reason — when that dataset is absent; never skipped
        when it is present but broken. Everything without this marker is HERMETIC and must run
        on a clean clone with no data, no mount and no network.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
